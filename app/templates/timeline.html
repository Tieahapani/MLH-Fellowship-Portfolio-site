{% extends "base.html" %}

{% block content %}
<main class="page">
<section class="reveal in">
    <div class="label">Timeline</div>
    <h2>{{ title }}</h2>

    <!-- Post Form -->
    <div class="glass timeline-form-card glow-card">
        <h3>Share an Update</h3>
        <form id="timeline-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="content">What's on your mind?</label>
                <textarea id="content" name="content" rows="4" placeholder="Share your update..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Post Update</button>
        </form>
    </div>

    <!-- Timeline Posts -->
    <div id="timeline-posts">
        {% for post in timeline_posts %}
        <div class="glass timeline-post glow-card">
            <div class="post-header">
                <img class="post-avatar" src="https://www.gravatar.com/avatar/{{ post.email_hash }}?s=50&d=identicon" alt="{{ post.name }}">
                <div>
                    <h4 class="post-name">{{ post.name }}</h4>
                    <span class="post-date">{{ post.created_at.strftime('%B %d, %Y at %I:%M %p') }}</span>
                </div>
            </div>
            <p class="post-content">{{ post.content }}</p>
        </div>
        {% endfor %}
    </div>
</section>
</main>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('timeline-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch('/api/timeline_post', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                window.location.reload();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Something went wrong. Please try again.');
            });
    });
</script>
{% endblock %}
