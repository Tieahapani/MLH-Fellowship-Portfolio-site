{% extends "base.html" %}

{% block content %}
<main class="page">
<section class="reveal in">
    <div class="label">Hobbies</div>
    <h2>{{ title }}</h2>
    <div class="hobby-grid">
        {% for hobby in hobbies %}
        <div class="hobby">
            {% if hobby.image %}
            <img src="./static/img/{{ hobby.image }}" alt="{{ hobby.name }}">
            {% endif %}
            <div class="ov">
                <h3>{{ hobby.name }}</h3>
                <p>{{ hobby.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
</main>
{% endblock %}
