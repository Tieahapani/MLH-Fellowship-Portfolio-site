# Rate limit: only POST requests get a limit key; 1 request/min per IP
map $request_method $timeline_post_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $timeline_post_limit_key zone=timelinepost:10m rate=1r/m;

server {
    listen 80;
    server_name tiea-portfolio.duckdns.org;

    if ($host = tiea-portfolio.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tiea-portfolio.duckdns.org;

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    location /api/timeline_post {
        limit_req zone=timelinepost;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }

    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;
}
